# Builds the site and runs every check the build runs, on each push to main and each pull request
# (hub decision 2026-11-03-christianjmills-launch-gate). It uses no secrets: bundles and the frozen
# copy come from the public bucket, and deploys run from the user's machine (tools/deploy.ts).
# Actions are pinned by commit, each the release before its newest (hub decision
# 2026-11-03-christianjmills-dependency-release-lag).
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # engines.node, which .npmrc enforces.
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Cache the frozen copy and the checks' browser
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            node_modules/.cache/christianjmills-archive
            ~/.cache/ms-playwright
          key: site-${{ hashFiles('legacy/archive.lock.json', 'package-lock.json') }}
      - name: Install the checks' browser
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm run build
