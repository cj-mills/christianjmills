# The STAGING profile: the public site plus the drafts tree (drafts/, git-ignored — born posts
# projected from the private notes graph; its journal is their durable source) and the review
# affordances, rendered into their own output dir so a staging render never touches _site/.
# The publish guard refuses any public output carrying a draft (design 13753cbf (1)).
project:
  output-dir: _site-staging
  render:
    - "**/*.qmd"
    - "**/*.md"

website:
  title: "Christian Mills — STAGING"

format:
  html:
    css:
      - styles.css
      - _staging/notes.css
    include-after-body:
      - _staging/src-refs-toggle.html
