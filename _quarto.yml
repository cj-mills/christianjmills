project:
  type: website
  # output-dir: docs

# One site source, two profiles (ruling 4d29dc2e; design 13753cbf (1)). `public` is the
# default, so a bare `quarto render` / `quarto publish` never sees the drafts; `staging`
# (quarto render --profile staging) adds the git-ignored drafts/ tree, projected from the
# private notes graph, plus the review affordances, into its own _site-staging/.
profile:
  default: public
  group:
    - [public, staging]

# The derived blocks of the archive posts (series callouts, hand TOCs, hand Previous / Next
# lines) leave the render and the post navigation replaces them (design 253ac996): site-build
# generates this filter and its data from the notes graph into the git-ignored _derived/.
filters:
  - _derived/derived-blocks.lua

# The site footer's generated lines (design 39c51c15 (6)): site-build writes them from the graph.
metadata-files:
  - _derived/site-footer.yml

# The copyright holder the generated footer names
copyright-holder: "Christian J. Mills"

# The site's one statement of its author (amendment fe6f0fb7): the author strip's byline and
# llms.txt's intro name them through {name} / {role}, and each post's JSON-LD carries the role as
# the author's jobTitle. Change the role here and every rendering follows.
site-author:
  name: "Christian Mills"
  role: "Applied AI Consultant and Educator"

# The post page's author strip (design 39c51c15 (5)): site chrome in the author's own words.
# site-build renders it at the end of every post in place of the about-author and questions
# includes. The byline names the author ({name}, {role} = site-author above). The pitch line
# shows only on a post that backs an OFFERED claim, once the page it links is published
# ({claims} = the claims' names, {href} = that page); the questions line closes every tutorial.
author-strip:
  byline: "**{name}** — {role}."
  links: "[About me](/about.html) · [Email](mailto:christian@christianjmills.com) · [GitHub](https://github.com/cj-mills)"
  pitch: "I take on this work for clients ({claims}) — [see how an engagement starts]({href})."
  questions: "Questions or problems with this tutorial? Post them in the comments below; I try to make time to address them on Thursdays and Fridays."

# The post page's comments (design 39c51c15 (1)): the giscus widget site-build renders at the end
# of every post, loading the thread the post's discussion fact names (else its canonical path as
# a strict term). The ids are the repo's and its Comments discussion category's; site-build
# refuses without them. base-paths = former deployment base paths, which the harvest drops from
# the old utterances threads' pathnames.
post-comments:
  repo: cj-mills/christianjmills
  repo-id: MDEwOlJlcG9zaXRvcnkyOTM2MTIwMjI=
  category: Comments
  category-id: DIC_kwDOEYAp9s4DGyfc
  theme:
    light: light
    dark: dark
  base-paths: [christianjmills-quarto]

# The agent layer (design 39c51c15 (7), amendments 23a49667 / 465ab923): site-build writes llms.txt
# from the notes graph's structure over Quarto's flat page list; this is its intro, in the author's
# words -- reading guidance a reader cannot infer from the list, nothing that decays as posts are
# added (summary = the blockquote, one sentence that stands alone, required; details = the
# paragraph under it). The build adds its own lines after it (how the links work, the licenses from
# the license facts, the Optional key), and heads each series section with its kind (Tutorials /
# Notes / Work). Quarto writes each page's .llms.md (website.llms-txt below).
llms-index:
  summary: "{name}, {role}: tutorials, study notes and project write-ups from hands-on work in applied machine learning since 2020."
  details: "Check a page's published and updated dates before relying on it: each tutorial was written and tested against the library versions current at the time and may not have been revised since, so version-specific steps can be out of date. Pages under a Notes heading are notes on a third party's work (a lecture, course or book): a paraphrase in my own words, where only marked quotations are verbatim. Questions and corrections are welcome in the comments on each page."

website:
  # Each page's markdown copy for agents (.llms.md, beside its .html)
  llms-txt: true
  cookie-consent: false
  favicon: images/favicon.ico
  site-url: "https://christianjmills.com"
  description: "This is Christian Mills' personal website."
  title: "Christian Mills"
  image: images/logo.png
  navbar:
    background: dark
    right:
      - text: "Blog"
        file: blog.qmd
      - text: "Tutorials"
        file: series/tutorials/index.md
      - text: "Notes"
        file: series/notes/index.md
      # - icon: file-person-fill
        # href: ./about.html
      # - text: "Services"
      #   file: services.qmd
      - about.qmd
      - icon: envelope-fill
        href: mailto:christian@christianjmills.com
      - icon: github
        href: https://github.com/cj-mills
      - icon: twitter-x
        href: https://twitter.com/cdotjdotmills
      - icon: linkedin
        href: https://www.linkedin.com/in/christianjmills
      # - icon: discord
      #   href: 
      - icon: rss
        href: blog.xml
  page-navigation: true
  # The footer's copyright and license lines are GENERATED by site-build into
  # _derived/site-footer.yml (see metadata-files above): the years from the public posts' own
  # dates, the licenses from the license facts (design 39c51c15 (6)).
  page-footer:

    # left:
    #   - icon: envelope-fill
    #     href: mailto:christian@christianjmills.com
    #   - icon: github
    #     href: https://github.com/cj-mills
    #   - icon: twitter
    #     href: https://twitter.com/cdotjdotmills
    #   - icon: rss
    #     href: index.xml
    # border: false
    background: dark
  back-to-top-navigation: false

  twitter-card:
    creator: "@cdotjdotmills"
    site: "@cdotjdotmills"
    image: images/logo.png
  open-graph:
    image: images/logo.png

format:
  html:
    theme:
      light: custom-flatly.scss
      dark: custom-darkly.scss
    css: styles.css
    # The title block's metadata row gains the post's Type (design 39c51c15 (2))
    template-partials:
      - _partials/title-metadata.html



