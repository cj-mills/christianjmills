project:
  type: website
  # output-dir: docs

# One site source, two profiles (ruling 4d29dc2e; design 13753cbf (1)). `public` is the
# default, so a bare `quarto render` / `quarto publish` never sees the drafts; `staging`
# (quarto render --profile staging) adds the git-ignored drafts/ tree, projected from the
# private notes graph, plus the review affordances, into its own _site-staging/.
profile:
  default: public
  group:
    - [public, staging]

# The derived blocks of the archive posts (series callouts, hand TOCs, hand Previous / Next
# lines) leave the render and the post navigation replaces them (design 253ac996): site-build
# generates this filter and its data from the notes graph into the git-ignored _derived/.
filters:
  - _derived/derived-blocks.lua

# The site footer's generated lines (design 39c51c15 (6)): site-build writes them from the graph.
metadata-files:
  - _derived/site-footer.yml
  # The navbar (finding c6befeb6, design ff0c6338 (6)): site-build writes it from site-nav and
  # site-links below
  - _derived/site-nav.yml

# Every page's title block sits inside the content grid (finding d807a18f): stated once here,
# never per directory or per page; the site's theme styles no banner, and site-build refuses a
# public page whose title block renders outside the grid.
title-block-banner: false

# The copyright holder the generated footer names
copyright-holder: "Christian J. Mills"

# The listing a post's categories link into (amendment of design 0858bbd0): each category in a
# post's title block links here, opened filtered to that category (#category=<name>). Named once;
# site-build derives every link from it.
category-listing: blog.qmd

# The site's one statement of its author (amendment fe6f0fb7): the author strip's byline and
# llms.txt's intro name them through {name} / {role}, and each post's JSON-LD carries the role as
# the author's jobTitle. Change the role here and every rendering follows. The photo (image) is the
# image the About page's JSON-LD Person and social card state, and its Person names the school
# (alumni-of). The About page DISPLAYS a derivative of the photo (design 2fba772c (4)), stated with
# its provenance -- the file, its text alternative, the photo it derives from, the model that made
# it, the prompt that steered it (none for a background removal) and any edit by hand after the
# model -- so it is never mistaken for the photo (60681b4f); site-build refuses a portrait lacking
# any of them, or one whose source is not the photo. Until the custom design system sets a style,
# the photo with its background removed, cropped by hand into a circle under the shoulders.
site-author:
  name: "Christian Mills"
  role: "Applied AI Consultant and Educator"
  image: images/profile.jpg
  alumni-of: "Arizona State University"
  portrait:
    image: images/profile-portrait.webp
    alt: "Christian Mills: a photograph with its background removed, cropped to a circle"
    source: images/profile.jpg
    model: bria/remove-background
    prompt: ""
    edit: "cropped by hand: an off-centre circle, then trimmed to a rectangle"

# The navbar's own entries, in order (finding c6befeb6): each names its target by SITE PATH, the URL
# a reader follows, never a source file. site-build resolves each page path to the one rendered
# source that renders it and writes the navbar into _derived/site-nav.yml, these entries first and
# the contact icons (site-links below) after them; a path nothing renders refuses the build, so a
# page whose source moves (a path transfer) keeps its link. An entry with an icon renders as it.
site-nav:
  - text: Blog
    path: /blog.html
  - text: Tutorials
    path: /series/tutorials/
  - text: Library
    path: /library/
  - text: About
    path: /about.html
  - text: RSS
    icon: rss
    path: /blog.xml

# The site's one statement of its contact links (design ff0c6338 (6)): the author strip's links line
# ({links}), the navbar's icons (generated into _derived/site-nav.yml, after the site-nav entries
# above) and the About page all render it. Change a link here and every rendering follows.
site-links:
  - icon: envelope-fill
    text: Email
    href: mailto:christian@christianjmills.com
  - icon: linkedin
    text: LinkedIn
    href: https://www.linkedin.com/in/christianjmills/
  - icon: github
    text: GitHub
    href: https://github.com/cj-mills

# What the site holds (design 8b4f15d0 (3)): the second part of the site's one sentence, written
# as the sentence carries it (a clause, no closing stop). The home page and About state it on its
# own line under the role; site-build refuses without it.
site-holds: "tutorials, study notes and project write-ups from hands-on work since 2020"

# The site's one sentence of who and what (amendment 5c3c2662 (1)): llms.txt's blockquote and the
# home page's meta description render it, COMPOSED from its parts -- the author through
# {name} / {role} (site-author above) and what the site holds through {holds} (site-holds above),
# so neither part is kept twice. One sentence that stands alone; site-build refuses without it.
site-summary: "{name}, {role}: {holds}."

# The post page's author strip (design 39c51c15 (5)): site chrome in the author's own words.
# site-build renders it at the end of every post in place of the about-author and questions
# includes. The byline names the author ({name}, {role} = site-author above), the links line the
# contact links ({links} = site-links above). The pitch line
# shows only on a post that backs an OFFERED claim, once the page it links is published
# ({claims} = the claims' names, {href} = that page); the questions line closes every tutorial.
author-strip:
  byline: "**{name}** — {role}."
  links: "[About me](/about.html) · {links}"
  pitch: "I take on this work for clients ({claims}) — [see how an engagement starts]({href})."
  questions: "Questions or problems with this tutorial? Post them in the comments below; I try to make time to address them on Thursdays and Fridays."

# The post page's comments (design 39c51c15 (1)): the giscus widget site-build renders at the end
# of every post, loading the thread the post's discussion fact names (else its canonical path as
# a strict term). The ids are the repo's and its Comments discussion category's; site-build
# refuses without them. base-paths = former deployment base paths, which the harvest drops from
# the old utterances threads' pathnames.
post-comments:
  repo: cj-mills/christianjmills
  repo-id: MDEwOlJlcG9zaXRvcnkyOTM2MTIwMjI=
  category: Comments
  category-id: DIC_kwDOEYAp9s4DGyfc
  theme:
    light: light
    dark: dark
  base-paths: [christianjmills-quarto]

# The site's one statement of how to read it (design ff0c6338 (4)), in the author's words: llms.txt's
# intro (after site-summary above) and the About page both render it -- reading guidance a reader
# cannot infer from the pages, nothing that decays as posts are added. The build adds llms.txt's own
# lines after it (how the links work, the licenses from the license facts, the Optional key), and
# heads each series section with its kind (Tutorials / Notes / Work). Quarto writes each page's
# .llms.md (website.llms-txt below).
reading-guide: "Check a page's published and updated dates before relying on it: each tutorial was written and tested against the library versions current at the time and may not have been revised since, so version-specific steps can be out of date. A notes page covers a third party's work (a lecture, course or book): a distillation of what I found most valuable, with occasional supplemental additions of my own, such as results from running a lecture's code on my own hardware or links to the sources a book cites. Those additions are mine, not the source's, and only marked quotations are verbatim. Questions and corrections are welcome in the comments on each post."

website:
  # Each page's markdown copy for agents (.llms.md, beside its .html)
  llms-txt: true
  cookie-consent: false
  favicon: images/favicon.ico
  site-url: "https://christianjmills.com"
  description: "This is Christian Mills' personal website."
  title: "Christian Mills"
  image: images/logo.png
  # The navbar is GENERATED by site-build into _derived/site-nav.yml (see metadata-files above):
  # the site-nav entries, then the site-links icons (finding c6befeb6, design ff0c6338 (6)). It
  # takes no background here: its colours are the design system's chrome, projected into the theme
  # (amendment of 0858bbd0) -- a value here would override the theme's.
  page-navigation: true
  # The footer's copyright and license lines are GENERATED by site-build into
  # _derived/site-footer.yml (see metadata-files above): the years from the public posts' own
  # dates, the licenses from the license facts (design 39c51c15 (6)); its colours and divider are
  # the design system's chrome, in the theme.
  back-to-top-navigation: false

  # The card stays for link previews; no account handle (the X account is no contact route,
  # design ff0c6338 (6))
  twitter-card:
    image: images/logo.png
  open-graph:
    image: images/logo.png

format:
  html:
    # The theme is PROJECTED (design 0858bbd0, amendment 4b58c9db): site-build writes one Quarto
    # theme per mode from the design system the profile is bound to on the graph (its site_profile
    # Entity's STYLED_BY), plus the system's fonts as woff2 under the git-ignored fonts/ -- Quarto
    # serves them beside the compiled stylesheet. Neither file is edited by hand.
    theme:
      light: _derived/theme-light.scss
      dark: _derived/theme-dark.scss
    css: styles.css
    # The title block's metadata row gains the post's Type (design 39c51c15 (2)); its categories
    # are links into the category listing (category-listing above)
    template-partials:
      - _partials/title-metadata.html
      - _partials/title-block.html



