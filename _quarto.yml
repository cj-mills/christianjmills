project:
  type: website
  # output-dir: docs

# One site source, two profiles (ruling 4d29dc2e; design 13753cbf (1)). `public` is the
# default, so a bare `quarto render` / `quarto publish` never sees the drafts; `staging`
# (quarto render --profile staging) adds the git-ignored drafts/ tree, projected from the
# private notes graph, plus the review affordances, into its own _site-staging/.
profile:
  default: public
  group:
    - [public, staging]

# The derived blocks of the archive posts (series callouts, hand TOCs, hand Previous / Next
# lines) leave the render and the post navigation replaces them (design 253ac996): site-build
# generates this filter and its data from the notes graph into the git-ignored _derived/.
filters:
  - _derived/derived-blocks.lua

# The post page's author strip (design 39c51c15 (5)): site chrome in the author's own words.
# site-build renders it at the end of every post in place of the about-author and questions
# includes. The pitch line shows only on a post that backs an OFFERED claim, once the page it
# links is published ({claims} = the claims' names, {href} = that page); the questions line
# closes every tutorial.
author-strip:
  byline: "**Christian Mills** — Applied AI Consultant and Educator."
  links: "[About me](/about.html) · [Email](mailto:christian@christianjmills.com) · [GitHub](https://github.com/cj-mills)"
  pitch: "I take on this work for clients ({claims}) — [see how an engagement starts]({href})."
  questions: "Questions or problems with this tutorial? Post them in the comments below; I try to make time to address them on Thursdays and Fridays."

