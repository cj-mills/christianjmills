<!-- Source-provenance toggle (read 9d301b5a; ruling de9c4cda). Included after the body by
     _quarto.yml. When a page carries timestamp links (a.src-ref) it gains one small button above
     the first heading of the body that hides or shows them; the choice is remembered per browser
     (localStorage), and a page with no provenance links gets no button. Nothing here is content:
     the rendered .md never carries it. -->
<script>
(function () {
  var KEY = "cjm-hide-src-refs";
  var body = document.body;
  var refs = document.querySelectorAll("a.src-ref");
  if (!refs.length) { return; }
  function apply(hide) {
    body.classList.toggle("hide-src-refs", hide);
    btn.textContent = hide ? "Show source timestamps" : "Hide source timestamps";
    btn.setAttribute("aria-pressed", hide ? "true" : "false");
  }
  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "src-refs-toggle";
  var hide = false;
  try { hide = window.localStorage.getItem(KEY) === "1"; } catch (e) {}
  btn.addEventListener("click", function () {
    hide = !body.classList.contains("hide-src-refs");
    try { window.localStorage.setItem(KEY, hide ? "1" : "0"); } catch (e) {}
    apply(hide);
  });
  var host = document.querySelector("main .callout") || document.querySelector("main h2") || document.querySelector("main");
  if (host && host.parentNode) {
    if (host.tagName === "MAIN") { host.insertBefore(btn, host.firstChild); }
    else { host.parentNode.insertBefore(btn, host.nextSibling); }
  }
  apply(hide);
})();
</script>
