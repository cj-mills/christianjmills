# options specified here will apply to all posts in this folder

# freeze computational output
# (see https://quarto.org/docs/projects/code-execution.html#freeze)
freeze: true

# Enable banner style title blocks
title-block-banner: true

page-layout: article

format:
  html:
    include-after-body: 
       - ../_cloudflare-analytics.qmd

# The card and preview image every series and topic page shares (design e240183f (3)): stated once
# here, not in each page, since the pages are projected from the graph.
twitter-card:
  creator: "@cdotjdotmills"
  site: "@cdotjdotmills"
  image: /images/default-preview-image-black.png
open-graph:
  image: /images/default-preview-image-black.png
